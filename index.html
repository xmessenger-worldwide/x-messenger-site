
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Messenger</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }
    header {
      background: #1d9bf0;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }
    .panel {
      background: #192734;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { background: #253341; color: white; }
    button {
      background: #1d9bf0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #536471; }
    #chat { display: none; }
    #messages {
      height: 300px;
      overflow-y: auto;
      background: #101820;
      padding: 10px;
      border-radius: 8px;
      margin: 12px 0;
    }
    .message {
      background: #253341;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .message strong { color: #1d9bf0; }
    #status { color: #aab8c2; font-size: 14px; }
  </style>
</head>
<body>
  <header>𝕏 Messenger</header>

  <main>
    <section class="panel" id="auth">
      <h2>Welcome to X Messenger</h2>
      <p>Create an account or log in to join the global chat.</p>
      <input id="name" placeholder="Your display name (for sign-up)" maxlength="40">
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <input id="password" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password">
      <button id="signup">Create account</button>
      <button id="login" class="secondary">Log in</button>
      <p id="status" role="status"></p>
    </section>

    <section class="panel" id="chat">
      <h2>Global Chat</h2>
      <p id="welcome"></p>
      <div id="messages"></div>
      <form id="messageForm">
        <input id="messageInput" placeholder="Write a message..." maxlength="500" required>
        <button type="submit">Send message</button>
      </form>
      <button id="logout" class="secondary">Log out</button>
      <p id="chatStatus" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, onAuthStateChanged,
      updateProfile, signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query,
      orderBy, limit, onSnapshot, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDnJ6uPkwfoszAVr0mG2fEY3552HXdz4VY",
      authDomain: "x-messenger-c107a.firebaseapp.com",
      projectId: "x-messenger-c107a",
      storageBucket: "x-messenger-c107a.firebasestorage.app",
      messagingSenderId: "174260508186",
      appId: "1:174260508186:web:c41867e0aafaac4c8363a3",
      measurementId: "G-6JK18E8JJQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authPanel = document.getElementById("auth");
    const chatPanel = document.getElementById("chat");
    const status = document.getElementById("status");
    const chatStatus = document.getElementById("chatStatus");
    const messagesBox = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");

    let stopMessages = null;

    document.getElementById("signup").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name) {
        status.textContent = "Please enter a display name.";
        return;
      }

      try {
        status.textContent = "Creating your account...";
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );
        await updateProfile(result.user, { displayName: name });
        status.textContent = "Account created!";
      } catch (error) {
        status.textContent = error.message;
      }
    });

    document.getElementById("login").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        status.textContent = "Logging in...";
        await signInWithEmailAndPassword(auth, email, password);
        status.textContent = "Logged in!";
      } catch (error) {
        status.textContent = error.message;
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (stopMessages) {
        stopMessages();
        stopMessages = null;
      }

      messagesBox.replaceChildren();
      authPanel.style.display = user ? "none" : "block";
      chatPanel.style.display = user ? "block" : "none";

      if (!user) return;

      document.getElementById("welcome").textContent =
        "Logged in as " + (user.displayName || user.email);

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "asc"),
        limit(100)
      );

      stopMessages = onSnapshot(messagesQuery, (snapshot) => {
        messagesBox.replaceChildren();

        snapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement("div");
          item.className = "message";

          const sender = document.createElement("strong");
          sender.textContent = (data.name || "User") + ": ";

          const content = document.createElement("span");
          content.textContent = data.text || "";

          item.append(sender, content);
          messagesBox.appendChild(item);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        chatStatus.textContent = "";
      }, (error) => {
        chatStatus.textContent =
          "Cannot load messages. Check your Firestore rules. " + error.message;
      });
    });

    document.getElementById("messageForm").addEventListener(
      "submit", async (event) => {
        event.preventDefault();

        const user = auth.currentUser;
        const message = messageInput.value.trim();

        if (!user || !message) return;

        try {
          chatStatus.textContent = "Sending...";
          await addDoc(collection(db, "messages"), {
            uid: user.uid,
            name: user.displayName || user.email || "User",
            text: message,
            createdAt: serverTimestamp()
          });

          messageInput.value = "";
          chatStatus.textContent = "";
        } catch (error) {
          chatStatus.textContent =
            "Message not sent. Check Firestore rules. " + error.message;
        }
      }
    );
  </script>
</body>
</html>
